# XX-WM portal preferences (portals.conf(5)): picked by the lowercased
# XDG_CURRENT_DESKTOP (XX-WM, set in xx-wm-session), so this file must
# stay named xx-wm-portals.conf. GTK covers file picking and Settings;
# screenshot/screencast go to the wlroots backend, which is what phoc
# (wlr-screencopy) speaks.
[preferred]
default=gtk;
org.freedesktop.impl.portal.Screenshot=wlr;
org.freedesktop.impl.portal.ScreenCast=wlr;
