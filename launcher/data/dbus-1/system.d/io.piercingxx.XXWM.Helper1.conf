<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Who may own the helper name: root only (the D-Bus-activated daemon). -->
  <policy user="root">
    <allow own="io.piercingxx.XXWM.Helper1"/>
    <allow send_destination="io.piercingxx.XXWM.Helper1"/>
  </policy>
  <!-- Who may call it: anyone on the system bus, but only the helper's
       own interface (plus the standard peer/introspection interfaces).
       Per-method authorization is still enforced by the helper itself
       via polkit. No console-scoped rule here: the legacy console
       attribute is deprecated and ignored by dbus-broker (postmarketOS /
       Fedora / Arch defaults), which would lock normal users out. -->
  <policy context="default">
    <allow send_destination="io.piercingxx.XXWM.Helper1"
           send_interface="io.piercingxx.XXWM.Helper1"/>
    <allow send_destination="io.piercingxx.XXWM.Helper1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.piercingxx.XXWM.Helper1"
           send_interface="org.freedesktop.DBus.Peer"/>
    <allow send_destination="io.piercingxx.XXWM.Helper1"
           send_interface="org.freedesktop.DBus.Properties"/>
  </policy>
</busconfig>
