[core]
# XWayland not needed for PiercingOS — disabling reduces attack surface and startup time
xwayland = false
# NOTE: auto-maximize (every app opens full-screen, phone-style) is NOT a
# phoc.ini key on phoc 0.56 — it is the GSetting `sm.puri.phoc auto-maximize`,
# which the session launcher sets. See data/xx-wm-session.in.

[output:DSI-1]
# Fairphone 5 (fairphone-fp5): 6.46" OLED, 2340x1080, 90 Hz, 401 PPI
# Scale 2.5 (401 PPI / 160 ≈ 2.51) → ~936x432 logical px
# Output name assumed DSI-1 on mainline — verify with: wlr-randr
# NOTE: the x86 tablet also reports DSI-1 but wants ~1.5 (1200x1920 panel).
# This per-device collision is why phoc.ini should be device-selected.
scale = 2.5

[output:HWCOMPOSER-1]
# Furi Phone FLX1 (FuriOS/Halium): 6.67" LCD, 1080x2400 — matches the
# stock FuriOS phosh scale → 360x800 logical px
scale = 3
