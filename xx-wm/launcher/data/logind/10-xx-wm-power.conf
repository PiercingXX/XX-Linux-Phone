# PiercingXX owns the power key: a short press blanks the screen, a long
# press opens the power menu (handled by the shell's DisplayManager).
# Without this, systemd-logind powers the device off on a single tap.
# System-wide; takes effect after a reboot or `systemctl restart systemd-logind`.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
