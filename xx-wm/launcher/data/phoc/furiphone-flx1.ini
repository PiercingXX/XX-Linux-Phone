[core]
# XWayland not needed for PiercingOS — disabling reduces attack surface and startup time
xwayland = false

[output:HWCOMPOSER-1]
# Furi Phone FLX1 (FuriOS/Halium): hwcomposer reports a 720x1600 mode
# (not the panel's 1080x2400), so scale 2 → 360x800 logical px, the same
# as stock FuriOS /etc/phosh/phoc.ini. Scale 3 gave a 240 px-wide shell.
scale = 2