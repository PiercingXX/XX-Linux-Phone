[core]
# XWayland not needed for PiercingOS — disabling reduces attack surface and startup time
xwayland = false

[output:HWCOMPOSER-1]
# Furi Phone FLX1 (FuriOS/Halium): hwcomposer reports a 720x1600 mode
# (not the panel's 1080x2400). Stock FuriOS uses scale 2 (360x800
# logical); the owner found that too large and 1.2 (600x1333) too
# small, so 1.6 → 450x1000 logical px. Scale 3 gave a 240 px-wide shell.
scale = 1.6