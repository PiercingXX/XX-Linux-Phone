[core]
# XWayland not needed for PiercingOS — disabling reduces attack surface and startup time
xwayland = false

[output:Virtual-1]
# QEMU/UTM virtual display (generic-x86_64 VM, 720x1440): scale 1.5 →
# 480x960 logical px. Owner-tuned 2026-10-17: 1 renders everything half
# size, 2 too big.
scale = 1.5
