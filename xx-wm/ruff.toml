# Ruff configuration for XX-WM
# Ignore E402 (module level import not at top) for GTK gi.require_version() pattern
#
# Pin the lint rule set explicitly. Ruff 0.16 broadened its default `select`
# to include flake8-blind-except (BLE), bandit (S), flake8-datetimez (DTZ),
# PLW/PIE/SIM/FURB/RUF preview rules, etc. That expansion is a tool-version
# drift, not this project's policy: the codebase was written against the
# classic default (E4/E7/E9/F) with E402 deliberately ignored for the GTK
# import pattern. Pinning `select` keeps the gate deterministic across ruff
# versions instead of failing on rules the project never opted into.

[lint]
select = ["E4", "E7", "E9", "F"]
extend-ignore = ["E402"]
