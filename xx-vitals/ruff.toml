# Matches ref/xx-wm ruff.toml: classic default (E4/E7/E9/F) with E402
# deliberately ignored for the GTK gi.require_version() import pattern.
# The select list is pinned so ruff-version drift never changes the gate.

[lint]
select = ["E4", "E7", "E9", "F"]
extend-ignore = ["E402"]
