# Ruff configuration for xx-captions (mirrors ref/xx-wm ruff.toml).
# Ignore E402 (module level import not at top) for the gi.require_version()
# pattern used once GTK surfaces land in lane 3.

[lint]
select = ["E4", "E7", "E9", "F"]
extend-ignore = ["E402"]

# Navigation scripts run inside scripts/snap.py, which execs them with
# `win`/`app` already in scope; they are never imported.
[lint.per-file-ignores]
"tools/nav_*.py" = ["F821"]
